name: Deploy Docusaurus to Pages

on:
  push:
    branches: ["001-robotics-course-book"] # Your branch name

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SETUP NODE (Vital for Docusaurus)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 2. INSTALL & BUILD
      - name: Install Dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build

      # 3. UPLOAD THE 'build' FOLDER
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build 

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4